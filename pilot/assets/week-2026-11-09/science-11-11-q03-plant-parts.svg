  <!-- pot -->
  <path d="M182 258 L298 258 L286 318 L194 318 Z" fill="#FF9600" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round"/>
  <!-- roots (white, visible on the pot) -->
  <path d="M218 260 Q210 282 214 306" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M240 260 Q240 284 240 310" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M262 260 Q270 282 266 306" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- arrow pointing to stem middle -->
  <line x1="400" y1="160" x2="272" y2="160" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/>
  <polygon points="252,160 274,147 274,173" fill="#2B2B2B"/>
  <text x="412" y="174" font-family="Verdana, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2B2B2B">X</text>
