  <path d="M234 158 Q200 128 163 144 Q194 176 234 168 Z" fill="#58CC02" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M246 196 Q280 164 316 180 Q286 212 246 204 Z" fill="#58CC02" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round"/>
  <!-- soil -->
