<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <rect width="480" height="360" fill="#FFF8E7"/>
  <!-- flower on top -->
  <circle cx="240" cy="38" r="13" fill="#FFC800" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="263" cy="55" r="13" fill="#FFC800" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="254" cy="82" r="13" fill="#FFC800" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="226" cy="82" r="13" fill="#FFC800" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="217" cy="55" r="13" fill="#FFC800" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="240" cy="60" r="10" fill="#FF9600" stroke="#2B2B2B" stroke-width="4"/>
  <!-- stem -->
  <rect x="234" y="72" width="12" height="180" fill="#58CC02" stroke="#2B2B2B" stroke-width="4"/>
