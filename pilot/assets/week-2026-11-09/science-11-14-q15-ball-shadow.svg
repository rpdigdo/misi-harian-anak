<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <rect width="480" height="360" fill="#FFF8E7"/>
  <!-- shadows on the wall -->
  <circle cx="205" cy="112" r="34" fill="#4A4A4A"/>
  <rect x="316" y="78" width="64" height="64" fill="#4A4A4A" stroke="#2B2B2B" stroke-width="3"/>
  <!-- yellow lamp on the left -->
  <ellipse cx="62" cy="252" rx="32" ry="9" fill="#2B2B2B"/>
  <rect x="58" y="150" width="8" height="100" fill="#2B2B2B"/>
  <line x1="62" y1="150" x2="104" y2="118" stroke="#2B2B2B" stroke-width="8" stroke-linecap="round"/>
  <polygon points="104,96 148,118 148,140 104,132" fill="#FFC800" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="142" cy="128" r="8" fill="#FFF8E7" stroke="#2B2B2B" stroke-width="3"/>
  <!-- light rays shining to the right -->
  <g stroke="#FFC800" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="120" x2="190" y2="112"/>
    <line x1="150" y1="130" x2="196" y2="128"/>
    <line x1="150" y1="140" x2="190" y2="148"/>
  </g>
  <!-- table -->
  <rect x="20" y="262" width="440" height="16" fill="#A9743F" stroke="#2B2B2B" stroke-width="4"/>
  <rect x="20" y="278" width="440" height="62" fill="#E8D9B8"/>
  <!-- red round ball -->
  <circle cx="205" cy="228" r="33" fill="#FF4B4B" stroke="#2B2B2B" stroke-width="4"/>
  <ellipse cx="194" cy="218" rx="9" ry="6" fill="#FF8A8A" transform="rotate(-30 194 218)"/>
  <!-- blue square box -->
  <rect x="318" y="202" width="60" height="60" fill="#1CB0F6" stroke="#2B2B2B" stroke-width="4"/>
  <line x1="318" y1="232" x2="378" y2="232" stroke="#2B2B2B" stroke-width="3"/>
</svg>
