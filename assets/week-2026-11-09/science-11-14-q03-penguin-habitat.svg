  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <line x1="52" y1="36" x2="68" y2="52"/><line x1="68" y1="36" x2="52" y2="52"/><line x1="60" y1="32" x2="60" y2="56"/>
    <line x1="132" y1="20" x2="148" y2="36"/><line x1="148" y1="20" x2="132" y2="36"/><line x1="140" y1="16" x2="140" y2="40"/>
    <line x1="332" y1="44" x2="348" y2="60"/><line x1="348" y1="44" x2="332" y2="60"/><line x1="340" y1="40" x2="340" y2="64"/>
    <line x1="412" y1="24" x2="428" y2="40"/><line x1="428" y1="24" x2="412" y2="40"/><line x1="420" y1="20" x2="420" y2="44"/>
  </g>
