  <path d="M60 300 Q120 292 180 300" fill="none" stroke="#D6F0FD" stroke-width="4" stroke-linecap="round"/>
  <path d="M320 320 Q380 312 440 320" fill="none" stroke="#D6F0FD" stroke-width="4" stroke-linecap="round"/>
  <!-- penguin -->
  <ellipse cx="186" cy="272" rx="20" ry="7" fill="#2B2B2B"/>
  <ellipse cx="222" cy="318" rx="16" ry="7" fill="#FF9600" stroke="#2B2B2B" stroke-width="3"/>
  <ellipse cx="258" cy="318" rx="16" ry="7" fill="#FF9600" stroke="#2B2B2B" stroke-width="3"/>
  <ellipse cx="240" cy="240" rx="56" ry="76" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="4"/>
  <ellipse cx="240" cy="256" rx="38" ry="54" fill="#FFFFFF"/>
  <ellipse cx="186" cy="248" rx="10" ry="26" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="3" transform="rotate(18 186 248)"/>
  <ellipse cx="294" cy="248" rx="10" ry="26" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="3" transform="rotate(-18 294 248)"/>
  <circle cx="222" cy="192" r="9" fill="#FFFFFF"/>
  <circle cx="258" cy="192" r="9" fill="#FFFFFF"/>
  <circle cx="223" cy="193" r="4" fill="#2B2B2B"/>
  <circle cx="259" cy="193" r="4" fill="#2B2B2B"/>
  <polygon points="240,204 228,214 252,214" fill="#FF9600" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"/>
