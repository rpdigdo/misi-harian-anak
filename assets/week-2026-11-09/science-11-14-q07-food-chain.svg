  <ellipse cx="204" cy="196" rx="7" ry="20" fill="#A9743F" stroke="#2B2B2B" stroke-width="3" transform="rotate(-12 204 196)"/>
  <ellipse cx="220" cy="194" rx="7" ry="20" fill="#A9743F" stroke="#2B2B2B" stroke-width="3" transform="rotate(8 220 194)"/>
  <circle cx="206" cy="226" r="19" fill="#A9743F" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="200" cy="222" r="2.5" fill="#2B2B2B"/>
