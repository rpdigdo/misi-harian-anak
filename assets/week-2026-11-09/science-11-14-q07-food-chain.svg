  <circle cx="276" cy="242" r="9" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3"/>
  <rect x="216" y="268" width="10" height="12" fill="#A9743F" stroke="#2B2B2B" stroke-width="3"/>
  <rect x="248" y="268" width="10" height="12" fill="#A9743F" stroke="#2B2B2B" stroke-width="3"/>
  <!-- orange fox (right, looking at the rabbit) -->
  <ellipse cx="400" cy="246" rx="44" ry="25" fill="#FF9600" stroke="#2B2B2B" stroke-width="4"/>
  <ellipse cx="448" cy="254" rx="28" ry="15" fill="#FF9600" stroke="#2B2B2B" stroke-width="4" transform="rotate(28 448 254)"/>
  <ellipse cx="464" cy="264" rx="10" ry="8" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3" transform="rotate(28 464 264)"/>
  <polygon points="346,206 340,176 362,194" fill="#FF9600" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="366,200 366,172 386,190" fill="#FF9600" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="362" cy="220" r="18" fill="#FF9600" stroke="#2B2B2B" stroke-width="4"/>
  <ellipse cx="338" cy="226" rx="15" ry="9" fill="#FFC800" stroke="#2B2B2B" stroke-width="3"/>
  <circle cx="324" cy="226" r="4" fill="#2B2B2B"/>
