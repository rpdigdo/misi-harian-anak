<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <rect width="480" height="360" fill="#FFF8E7"/>
  <!-- sun low on the left -->
  <circle cx="58" cy="72" r="28" fill="#FF9600" stroke="#2B2B2B" stroke-width="4"/>
  <g stroke="#FF9600" stroke-width="5" stroke-linecap="round">
    <line x1="58" y1="28" x2="58" y2="14"/>
    <line x1="58" y1="116" x2="58" y2="130"/>
    <line x1="14" y1="72" x2="0" y2="72"/>
    <line x1="102" y1="72" x2="116" y2="72"/>
    <line x1="27" y1="41" x2="17" y2="31"/>
    <line x1="89" y1="41" x2="99" y2="31"/>
    <line x1="27" y1="103" x2="17" y2="113"/>
    <line x1="89" y1="103" x2="99" y2="113"/>
  </g>
  <!-- grass -->
  <rect x="0" y="256" width="480" height="104" fill="#58CC02"/>
  <!-- shadows (dark, flat, stretching to the right; tree shadow clearly the longest) -->
  <ellipse cx="148" cy="264" rx="20" ry="6" fill="#4A4A4A"/>
  <polygon points="258,256 298,256 302,270 262,270" fill="#4A4A4A"/>
  <polygon points="374,256 464,256 470,270 380,270" fill="#4A4A4A"/>
  <!-- short round bush -->
  <circle cx="96" cy="240" r="22" fill="#3D9E00" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="122" cy="228" r="24" fill="#3D9E00" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="138" cy="242" r="18" fill="#3D9E00" stroke="#2B2B2B" stroke-width="4"/>
  <!-- medium fence post -->
  <rect x="224" y="196" width="30" height="60" fill="#8B5A2B" stroke="#2B2B2B" stroke-width="4"/>
  <rect x="218" y="188" width="42" height="10" fill="#8B5A2B" stroke="#2B2B2B" stroke-width="4"/>
  <!-- tall tree -->
  <rect x="356" y="148" width="18" height="108" fill="#8B5A2B" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="332" cy="122" r="30" fill="#3D9E00" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="366" cy="100" r="34" fill="#3D9E00" stroke="#2B2B2B" stroke-width="4"/>
  <circle cx="396" cy="126" r="28" fill="#3D9E00" stroke="#2B2B2B" stroke-width="4"/>
</svg>
