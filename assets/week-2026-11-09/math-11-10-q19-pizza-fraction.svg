<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <rect width="480" height="360" fill="#FFF8E7"/>
  <!-- Pizza cut into 8 equal slices; top 2 slices red, other 6 light yellow with dots -->
  <circle cx="240" cy="185" r="130" fill="#FFC800" fill-opacity="0.35" stroke="#2B2B2B" stroke-width="3"/>
  <!-- Top 2 slices shaded red -->
  <path d="M240,185 L156.6,101.6 A130,130 0 0 1 240,55 Z" fill="#FF4B4B" stroke="#2B2B2B" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M240,185 L240,55 A130,130 0 0 1 323.4,101.6 Z" fill="#FF4B4B" stroke="#2B2B2B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Radial slice lines -->
  <g stroke="#2B2B2B" stroke-width="2">
    <line x1="240" y1="185" x2="331.9" y2="93.1"/>
    <line x1="240" y1="185" x2="370" y2="185"/>
    <line x1="240" y1="185" x2="331.9" y2="276.9"/>
    <line x1="240" y1="185" x2="240" y2="315"/>
    <line x1="240" y1="185" x2="148.1" y2="276.9"/>
    <line x1="240" y1="185" x2="110" y2="185"/>
    <line x1="240" y1="185" x2="148.1" y2="93.1"/>
  </g>
  <!-- Small dots on the 6 plain slices -->
  <g fill="#FF9600">
    <circle cx="295.4" cy="162" r="4.5"/>
    <circle cx="332.4" cy="146.7" r="4.5"/>
    <circle cx="295.4" cy="208" r="4.5"/>
    <circle cx="332.4" cy="223.3" r="4.5"/>
    <circle cx="263" cy="240.4" r="4.5"/>
    <circle cx="278.3" cy="277.4" r="4.5"/>
    <circle cx="217" cy="240.4" r="4.5"/>
    <circle cx="201.7" cy="277.4" r="4.5"/>
    <circle cx="184.6" cy="208" r="4.5"/>
    <circle cx="147.6" cy="223.3" r="4.5"/>
    <circle cx="184.6" cy="162" r="4.5"/>
    <circle cx="147.6" cy="146.7" r="4.5"/>
  </g>
  <!-- Crust ring and outer outline -->
  <circle cx="240" cy="185" r="126" fill="none" stroke="#FF9600" stroke-width="7"/>
  <circle cx="240" cy="185" r="130" fill="none" stroke="#2B2B2B" stroke-width="3"/>
</svg>
