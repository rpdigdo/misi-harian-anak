<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <rect width="480" height="360" fill="#FFF8E7"/>
  <!-- Analog clock showing 3:15 -->
  <circle cx="240" cy="185" r="130" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5"/>
  <!-- Hour tick marks -->
  <g stroke="#2B2B2B" stroke-width="3" stroke-linecap="round">
    <line x1="240" y1="63" x2="240" y2="75"/>
    <line x1="301" y1="79.5" x2="295" y2="90"/>
    <line x1="345.5" y1="124" x2="335" y2="130"/>
    <line x1="362" y1="185" x2="350" y2="185"/>
    <line x1="345.5" y1="246" x2="335" y2="240"/>
    <line x1="301" y1="290.5" x2="295" y2="280"/>
    <line x1="240" y1="307" x2="240" y2="295"/>
    <line x1="179" y1="290.5" x2="185" y2="280"/>
    <line x1="134.5" y1="246" x2="145" y2="240"/>
    <line x1="118" y1="185" x2="130" y2="185"/>
    <line x1="134.5" y1="124" x2="145" y2="130"/>
    <line x1="179" y1="79.5" x2="185" y2="90"/>
  </g>
  <!-- Numbers 1 to 12 -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#2B2B2B" text-anchor="middle" dominant-baseline="central">
    <text x="240" y="87">12</text>
    <text x="289" y="100">1</text>
    <text x="325" y="136">2</text>
    <text x="338" y="185">3</text>
    <text x="325" y="234">4</text>
    <text x="289" y="270">5</text>
    <text x="240" y="283">6</text>
    <text x="191" y="270">7</text>
    <text x="155" y="234">8</text>
    <text x="142" y="185">9</text>
    <text x="155" y="136">10</text>
    <text x="191" y="100">11</text>
  </g>
  <!-- Minute hand pointing at 3 (15 minutes) -->
  <line x1="240" y1="185" x2="345" y2="185" stroke="#2B2B2B" stroke-width="7" stroke-linecap="round"/>
  <!-- Hour hand just past 3 -->
  <line x1="240" y1="185" x2="309.4" y2="194.1" stroke="#2B2B2B" stroke-width="9" stroke-linecap="round"/>
  <circle cx="240" cy="185" r="9" fill="#2B2B2B"/>
</svg>
